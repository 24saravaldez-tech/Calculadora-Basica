<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="contenedorMayor">

        <div class="contenedor1">

            <div>
                <input type="text" class="salida" readonly>
            </div>

            <div class="contenedor2">
                <button class="btn btn-dark boton eliminar" id="AC">AC</button>
                <button class="btn btn-dark boton operador" id="parentesis">()</button>
                <button class="btn btn-dark boton operador" id="%">%</button>
                <button class="btn btn-dark boton operador" id="/">/</button>
            </div>

            <div class="contenedor2">
                <button class="btn btn-dark boton boton-numero" id="7">7</button>
                <button class="btn btn-dark boton boton-numero" id="8">8</button>
                <button class="btn btn-dark boton boton-numero" id="9">9</button>
                <button class="btn btn-dark boton operador" id="*">*</button>
            </div>

            <div class="contenedor2">
                <button class="btn btn-dark boton boton-numero" id="4">4</button>
                <button class="btn btn-dark boton boton-numero" id="5">5</button>
                <button class="btn btn-dark boton boton-numero" id="6">6</button>
                <button class="btn btn-dark boton operador" id="-">-</button>
            </div>

            <div class="contenedor2">
                <button class="btn btn-dark boton boton-numero" id="uno" value="1">1</button>
                <button class="btn btn-dark boton boton-numero" id="2">2</button>
                <button class="btn btn-dark boton boton-numero" id="3">3</button>
                <button class="btn btn-dark boton operador" id="+">+</button>
            </div>

            <div class="contenedor2">
                <button class="btn btn-dark boton boton-numero" id="0">0</button>
                <button class="btn btn-dark boton boton-numero" id="punto">.</button>
                <button class="btn btn-dark boton" id="borrar"><img src="./delete-left-solid-full.svg" alt=""></button>
                <button class="btn btn-dark boton resultado" id="total">=</button>
            </div>
        </div>
    </div>


    <!-- Ancla de javascript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./app.js"></script>
</body>

</html>
